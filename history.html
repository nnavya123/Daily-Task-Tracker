<!DOCTYPE html>
<html>
<head>
    <title>Task History</title>
    <link rel="stylesheet" href="style.css">
</head>
<a href="index.html">
  <button style="margin:15px;">⬅ Back to Dashboard</button>
</a>

<body>

<h1>Task History</h1>

<div class="form-container">
    <input type="date" id="searchDate">
    <input type="text" id="searchText" placeholder="Search by task name">
    <button onclick="searchTasks()">Search</button>
    <button onclick="goBack()">Back</button>
</div>

<table>
    <thead>
        <tr>
            <th>Task Name</th>
            <th>Date</th>
            <th>Status</th>
            <th>Notes</th>
        </tr>
    </thead>
    <tbody id="historyTable"></tbody>
</table>

<script src="history.js"></script>
</body>
</html>
